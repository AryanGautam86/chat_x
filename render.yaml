services:
  # Distinct from the older "chatbot" service deployed from the Chat_boT repo,
  # so the two run side by side on their own URLs.
  - type: web
    name: chat-x
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

    envVars:
      # Paste your Google AI key in the Render dashboard.
      - key: GEMINI_API_KEY
        sync: false

      # Render generates this once and keeps it across deploys, so users stay
      # signed in. Do not switch this to sync:false unless you set it yourself —
      # a value that changes per deploy invalidates every access token.
      - key: JWT_SECRET
        generateValue: true

      # Optional: enables the Google sign-in button. Add your Render URL to
      # "Authorised JavaScript origins" on the OAuth client first.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # Managed Postgres, because the container filesystem is ephemeral. With
      # the default SQLite database every restart — including a free-plan wake
      # from idle — dropped the users table, so accounts silently vanished and
      # signing in failed with "Incorrect email or password."
      - key: DATABASE_URL
        fromDatabase:
          name: chat-x-db
          property: connectionString

databases:
  - name: chat-x-db
    plan: free
